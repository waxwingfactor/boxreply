[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boxreply"
version = "1.0.0"
description = "Offline reconciliation of departmental physical-records review returns"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "BoxReply contributors"}]
dependencies = ["openpyxl==3.1.5", "defusedxml==0.7.1", "et-xmlfile==2.0.0"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Topic :: Office/Business"]

[project.urls]
Repository = "https://github.com/waxwingfactor/boxreply"
Issues = "https://github.com/waxwingfactor/boxreply/issues"

[project.scripts]
boxreply = "boxreply.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
