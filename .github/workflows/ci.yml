name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]" lxml
      - run: python -m pytest
      - run: python -m build
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Wheel fresh environment acceptance
        run: python scripts/verify_release.py --artifact dist/boxreply-1.0.0-py3-none-any.whl --work "${{ runner.temp }}/wheel-acceptance"
      - name: Source fresh environment acceptance
        run: python scripts/verify_release.py --artifact dist/boxreply-1.0.0.tar.gz --work "${{ runner.temp }}/sdist-acceptance"
      - uses: actions/upload-artifact@v4
        with:
          name: package-acceptance-reports
          path: |
            ${{ runner.temp }}/wheel-acceptance/report.json
            ${{ runner.temp }}/sdist-acceptance/report.json
  required:
    if: always()
    needs: [test, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported environment
        env:
          RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: test "$RESULT" = success && test "$PACKAGE_RESULT" = success
